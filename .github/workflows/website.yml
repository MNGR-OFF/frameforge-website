name: FrameForge website

on:
  push:
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Publish the reviewed website to GitHub Pages'
        type: boolean
        required: true
        default: false
      site_origin:
        description: 'HTTPS origin, without a repository path'
        type: string
        default: 'https://frameforgeui.website'
      base_path:
        description: 'Use / for the custom domain, or /repository/ for a project site'
        type: string
        default: '/'

permissions:
  contents: read

concurrency:
  group: frameforge-website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    env:
      SITE_ORIGIN: ${{ inputs.site_origin || 'https://frameforgeui.website' }}
      SITE_BASE_PATH: ${{ inputs.base_path || '/' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install locked website dependencies
        run: npm ci
      - name: Build static HTML
        run: npm run build
      - name: Check types, routes, links, metadata, and output boundaries
        run: npm run check
      - name: Install Chromium for browser verification
        run: npx playwright install --with-deps chromium
      - name: Verify interaction, accessibility, and responsive behavior
        run: npm run test:browser
      - name: Require publication readiness before preparing a deployment
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        run: npm run check:publication
      - name: Upload only the static website
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  project-path-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    env:
      SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
      SITE_BASE_PATH: /frameforge-preview/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - name: Build and check a nested project-site base path
        run: |
          npm run build
          npm run check

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [build, project-path-check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified static output
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
